# NOTE only Cython is needed to build: no Cython module cimports numpy or
#      scipy, only libc and the .pxd files of pyfe3d
[build-system]
requires = [
    "setuptools>=77",
    "cython",
    "tomli; python_version < '3.11'",
]
build-backend = "setuptools.build_meta"

[project]
name = "pyfe3d"
version = "0.12.0"
description = "General-purpose finite element solver for structural analysis and optimization based on Python and Cython"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE", "AUTHORS"]
requires-python = ">=3.10"
authors = [
    { name = "Saullo G. P. Castro", email = "S.G.P.Castro@tudelft.nl" },
]
keywords = [
    "finite elements", "structural analysis", "structural optimization",
    "static analysis", "buckling", "vibration", "panel flutter",
    "structural dynamics", "implicit time integration",
    "explicit time integration",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Education",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: POSIX :: BSD",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Unix",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "numpy",
    "scipy",
]

[project.urls]
Homepage = "https://github.com/saullocastro/pyfe3d"
Documentation = "https://saullocastro.github.io/pyfe3d/"
Repository = "https://github.com/saullocastro/pyfe3d"

[tool.setuptools.packages.find]
include = ["pyfe3d*"]

[tool.setuptools.package-data]
pyfe3d = ["*.pxd", "*.pyx"]

[tool.pytest.ini_options]
markers = [
    "slow: 40 s or more per test with the line-traced build of the Cython code (measured on Windows, MSVC /Od, 6 pytest-xdist processes, 2026-10-29), and covering no line of the .pyx files that the other tests do not cover (pytest --cov-context=test); deselected with -m \"not slow\" in the line-traced run of .github/workflows/coverage.yml only, run everywhere else",
]
